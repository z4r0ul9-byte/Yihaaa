<!--
  index.html
  Tujuan     : Shell UI aplikasi hand-tracking (Mode Rope & Balok Glow).
  Dependensi : css/style.css, js/main.js (ES module)
-->
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0e" />
  <title>Hand Gesture — Dual Mode</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>Hand Gesture <span class="phase">Dual Mode</span></h1>
    </header>

    <div id="status" class="status" role="status" aria-live="polite">
      Tekan tombol <strong>Mulai Kamera</strong> untuk memulai.
    </div>

    <section class="stage-wrap">
      <div id="stage" class="stage">
        <video id="video" playsinline autoplay muted></video>
        <canvas id="overlay"></canvas>
        
        <!-- Debug HUD -->
        <div id="debug-hud" class="hud">
          <div>FPS: <span id="hud-fps">-</span></div>
          <div>Hands: <span id="hud-hands">0</span></div>
          <div>Gesture: <span id="hud-gesture">-</span></div>
          <div>dNorm: <span id="hud-pinch">0.000</span></div>
        </div>
      </div>
      
      <div class="toolbar">
        <button id="btn-toggle-hud" class="btn-sm btn-primary">HUD: ON</button>
        <button id="btn-toggle-mode" class="btn-sm" style="background:#8a2be2; border-color:#8a2be2; color:#fff;">Mode: Rope</button>
        <button id="btn-toggle-cal" class="btn-sm">⚙️ Kalibrasi</button>
      </div>

      <!-- Calibration Panel -->
      <div id="cal-panel" class="panel hidden">
        <div class="form-group">
          <label>Pinch IN (Masuk): <span id="val-pinch-in">0.25</span></label>
          <input type="range" id="slider-pinch-in" min="0.10" max="0.40" step="0.01">
        </div>
        <div class="form-group">
          <label>Pinch OUT (Keluar): <span id="val-pinch-out">0.35</span></label>
          <input type="range" id="slider-pinch-out" min="0.30" max="0.60" step="0.01">
        </div>
        <div class="form-group">
          <label>Cursor Alpha: <span id="val-cursor-alpha">0.50</span></label>
          <input type="range" id="slider-cursor-alpha" min="0.1" max="0.9" step="0.05">
        </div>
        <div class="panel-actions">
          <button id="btn-auto-cal" class="btn-sm btn-primary" style="flex:2">Mulai Kalibrasi Otomatis</button>
          <button id="btn-reset-config" class="btn-sm btn-danger" style="flex:1">Reset</button>
        </div>
        <div id="lbl-auto-status" class="auto-status hidden"></div>
      </div>

      <p class="hint" id="mode-hint">
        Tunjukkan dua tangan (kiri & kanan) ke kamera. Tali karet akan otomatis menyambung di ujung telunjuk lu!
      </p>
    </section>

    <footer class="controls">
      <button id="startBtn" type="button" class="btn">Mulai Kamera</button>
    </footer>
  </main>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
