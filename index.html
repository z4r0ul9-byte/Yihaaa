<!--
  index.html
  Tujuan     : Shell UI aplikasi hand-tracking (Fase A: kamera + deteksi + overlay landmark).
  Dependensi : css/style.css, js/main.js (ES module)
  Catatan    : Tidak ada framework. Overlay canvas disamakan dengan resolusi video,
               video di-mirror via CSS (kamera depan), canvas TIDAK di-mirror —
               mirroring landmark dilakukan saat draw supaya teks label tetap terbaca.
-->
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0e" />
  <title>Hand Gesture — Fase A</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>Hand Gesture <span class="phase">Fase A</span></h1>
    </header>

    <div id="status" class="status" role="status" aria-live="polite">
      Tekan tombol <strong>Mulai Kamera</strong> untuk memulai.
    </div>

    <section class="stage-wrap">
      <div id="stage" class="stage">
        <video id="video" playsinline autoplay muted></video>
        <canvas id="overlay"></canvas>
      </div>
      <p class="hint">
        Arahkan 1&ndash;2 tangan ke kamera depan. Skeleton 21 landmark akan
        tergambar realtime di atas video.
      </p>
    </section>

    <footer class="controls">
      <button id="startBtn" type="button" class="btn">Mulai Kamera</button>
    </footer>
  </main>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
