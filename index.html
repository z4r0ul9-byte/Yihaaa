<!--
  index.html
  Tujuan     : Shell UI aplikasi hand-tracking (Fase D: Drag / Pan).
  Dependensi : css/style.css, js/main.js (ES module)
-->
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0e" />
  <title>Hand Gesture — Fase D</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>Hand Gesture <span class="phase">Fase D</span></h1>
    </header>

    <div id="status" class="status" role="status" aria-live="polite">
      Tekan tombol <strong>Mulai Kamera</strong> untuk memulai.
    </div>

    <section class="stage-wrap">
      <div id="stage" class="stage">
        <video id="video" playsinline autoplay muted></video>
        <canvas id="overlay"></canvas>
      </div>
      
      <!-- Target Zoom & Pan: Area ini yang akan di-scale & di-translate -->
      <div class="zoom-container">
        <div id="zoom-target" class="zoom-target">
          <div class="grid-content">DRAG & ZOOM</div>
        </div>
      </div>
      
      <p class="hint">
        Cubit jempol & telunjuk, lalu gerakkan tangan untuk geser (drag). <br/>
        Jauhkan/dekatkan jari untuk zoom.
      </p>
    </section>

    <footer class="controls">
      <button id="startBtn" type="button" class="btn">Mulai Kamera</button>
    </footer>
  </main>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
